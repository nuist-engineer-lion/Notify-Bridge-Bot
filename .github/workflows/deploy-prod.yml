name: Auto Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    env:
      REMOTE_DIR: /DATA/Documents/Notify-Bridge-Bot
      REMOTE_PORT: ${{ secrets.REMOTE_PORT != '' && secrets.REMOTE_PORT || '22' }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect change type
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BEFORE="${{ github.event.before }}"
          else
            BEFORE="${{ github.event.before }}"
          fi
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            # first push / unknown base: treat as full deploy
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Detected full deploy (no valid before sha)"
            exit 0
          fi

          mapfile -t files < <(git diff --name-only "$BEFORE" "${{ github.sha }}" || true)
          echo "Changed files:"
          printf '%s\n' "${files[@]}"

          code=0
          config=0
          for f in "${files[@]}"; do
            case "$f" in
              config.yaml.enc|.sops.yaml|scripts/apply-encrypted-config|scripts/apply-encrypted-config.ps1|scripts/config-encrypt|scripts/config-encrypt.ps1)
                config=1
                ;;
              src/*|main.py|pyproject.toml|uv.lock|.github/workflows/*|scripts/*)
                code=1
                ;;
            esac
          done

          if [ "$code" -eq 1 ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Detected full code deploy"
          elif [ "$config" -eq 1 ]; then
            echo "mode=config" >> "$GITHUB_OUTPUT"
            echo "Detected config-only hot reload"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "No classified changes; defaulting to full deploy"
          fi

      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Setup SSH private key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking accept-new
          EOF

      - name: Deploy via cloudflared SSH
        id: deploy
        env:
          MODE: ${{ steps.changes.outputs.mode }}
        run: |
          set -euo pipefail
          SSH_BASE=(ssh -p "$REMOTE_PORT")
          if [ -n "${CLOUDFLARE_ACCESS_CLIENT_ID:-}" ] && [ -n "${CLOUDFLARE_ACCESS_CLIENT_SECRET:-}" ]; then
            SSH_BASE+=(-o "ProxyCommand=cloudflared access ssh --hostname %h --id ${CLOUDFLARE_ACCESS_CLIENT_ID} --secret ${CLOUDFLARE_ACCESS_CLIENT_SECRET}")
          else
            SSH_BASE+=(-o "ProxyCommand=cloudflared access ssh --hostname %h")
          fi
          TARGET="${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}"

          remote() {
            "${SSH_BASE[@]}" "$TARGET" "$@"
          }

          if [ "$MODE" = "config" ]; then
            echo "=== Config-only hot apply ==="
            remote "cd '$REMOTE_DIR' && \
              git pull --ff-only origin main && \
              SOPS_AGE_KEY_FILE=\"\${SOPS_AGE_KEY_FILE:-/etc/notifybot/age.key}\" \
              WAIT_RELOAD=1 WAIT_SECONDS=90 \
              bash scripts/apply-encrypted-config config.yaml.enc config.yaml"
          else
            echo "=== Full deploy with restart ==="
            remote "cd '$REMOTE_DIR' && \
              git pull --ff-only origin main && \
              if [ -f config.yaml.enc ]; then \
                SOPS_AGE_KEY_FILE=\"\${SOPS_AGE_KEY_FILE:-/etc/notifybot/age.key}\" \
                bash scripts/apply-encrypted-config config.yaml.enc config.yaml; \
              fi && \
              uv sync && \
              sudo systemctl restart notifybot"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Verify deployment
        env:
          MODE: ${{ steps.changes.outputs.mode }}
        run: |
          set -euo pipefail
          SSH_BASE=(ssh -p "$REMOTE_PORT")
          if [ -n "${CLOUDFLARE_ACCESS_CLIENT_ID:-}" ] && [ -n "${CLOUDFLARE_ACCESS_CLIENT_SECRET:-}" ]; then
            SSH_BASE+=(-o "ProxyCommand=cloudflared access ssh --hostname %h --id ${CLOUDFLARE_ACCESS_CLIENT_ID} --secret ${CLOUDFLARE_ACCESS_CLIENT_SECRET}")
          else
            SSH_BASE+=(-o "ProxyCommand=cloudflared access ssh --hostname %h")
          fi
          TARGET="${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}"
          remote() {
            "${SSH_BASE[@]}" "$TARGET" "$@"
          }

          echo "=== 1. Checking Git commit on remote ==="
          REMOTE_COMMIT="$(remote "cd '$REMOTE_DIR' && git rev-parse HEAD")"
          LOCAL_COMMIT="${{ github.sha }}"
          echo "Remote commit: $REMOTE_COMMIT"
          echo "Expected     : $LOCAL_COMMIT"
          if [ "$REMOTE_COMMIT" != "$LOCAL_COMMIT" ]; then
            echo "Commit mismatch! Remote is not updated to the pushed commit."
            exit 1
          fi
          echo "Git commit matches."

          if [ "$MODE" = "config" ]; then
            echo "=== 2. Checking reload status ==="
            remote "cd '$REMOTE_DIR' && test -f archives/reload-status.json && python3 - <<'PY'
          import json, os
          data=json.load(open('archives/reload-status.json', encoding='utf-8'))
          assert data.get('ok') is True, data
          cfg_mtime=float(data.get('config_mtime') or 0)
          actual=os.path.getmtime('config.yaml')
          assert cfg_mtime > 0 and abs(cfg_mtime - actual) <= 2, (
              f'stale reload status: status.config_mtime={cfg_mtime} config.yaml mtime={actual}', data)
          print('reload ok:', data)
          PY"
            echo "=== 3. Service should still be active (no restart required) ==="
            remote "sudo systemctl is-active --quiet notifybot"
            echo "Config hot-apply verification passed."
          else
            echo "=== 2. Checking service status ==="
            if ! remote "sudo systemctl is-active --quiet notifybot"; then
              echo "Service notifybot is NOT active"
              remote "sudo systemctl status notifybot --no-pager -l" || true
              exit 1
            fi
            ACTIVE_STATE="$(remote "sudo systemctl show notifybot -p ActiveState --value")"
            if [ "$ACTIVE_STATE" != "active" ]; then
              echo "Service ActiveState is '$ACTIVE_STATE' (expected 'active')"
              exit 1
            fi
            echo "Service is active and running."
            echo "Deployment verification passed."
          fi